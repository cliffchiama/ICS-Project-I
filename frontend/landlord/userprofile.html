<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pata Place – User Profile</title>
<link rel="icon" type="image/png" href="../assets/headicon.png">
<style>
* { 
    box-sizing: border-box; 
    margin: 0; padding: 0; 
    font-family: 'Segoe UI', Arial, sans-serif; 
}
body { 
    background: #F4F7FB; 
}
.nav { 
    background: #1A3C6B; 
    padding: 0 28px; 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    height: 52px; 
}
.nav-brand { 
    color: #fff; 
    font-weight: 600; 
    font-size: 15px; 
}
.nav-links { 
    display: flex; 
    gap: 24px; 
    align-items: center; 
}
.nav-links a { 
    color: rgba(255,255,255,0.75); 
    font-size: 13px; 
    text-decoration: none; 
}
.nav-links a.active { 
    color: #fff; 
    font-weight: 600; 
}
.nav-btn { 
    background: #fff; 
    color: #1A3C6B; 
    border: none; 
    border-radius: 20px; 
    padding: 5px 16px; 
    font-size: 12px; 
    font-weight: 600; 
    cursor: pointer;
}
.content { 
    max-width: 900px; 
    margin: 28px auto; 
    padding: 0 28px; 
    display: grid; 
    grid-template-columns: 240px 1fr; 
    gap: 24px; 
}
.sidebar { 
    display: flex; 
    flex-direction: column; 
    gap: 16px; 
}
.profile-card { 
    background: #fff; 
    border-radius: 14px; 
    border: 1px solid #E0E7EF; 
    padding: 24px; 
    text-align: center; 
}
.avatar { 
    width: 68px; 
    height: 68px; 
    border-radius: 50%; 
    background: #1A3C6B; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 24px; 
    font-weight: 700; 
    color: #fff; 
    margin: 0 auto 12px; 
}
.profile-name { 
    font-size: 16px; 
    font-weight: 700; 
    color: #1A1A2E; 
}
.profile-role { 
    font-size: 12px; 
    color: #6B7A8D; 
    margin-top: 3px; 
}
.profile-badge { 
    display: inline-block; 
    background: #EAF3DE; 
    color: #3B6D11; 
    border-radius: 20px; 
    padding: 3px 12px; 
    font-size: 11px; 
    font-weight: 700; 
    margin-top: 10px; 
}
.profile-badge.suspended {
    background: #FBE2E2;
    color: #A32D2D;
}
.stats-mini { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 8px; 
    margin-top: 16px; 
}
.stat-mini { 
    background: #F4F7FB; 
    border-radius: 8px; 
    padding: 10px; 
    text-align: center; 
}
.stat-mini-val { 
    font-size: 18px; 
    font-weight: 700; 
    color: #1A3C6B; 
}
.stat-mini-label { 
    font-size: 10px; 
    color: #6B7A8D; 
    margin-top: 2px; 
}
.menu-card { 
    background: #fff; 
    border-radius: 14px; 
    border: 1px solid #E0E7EF; 
    overflow: hidden; 
}
.menu-item { 
    display: flex; 
    align-items: center; 
    gap: 10px; 
    padding: 12px 16px; 
    font-size: 13px; 
    color: #4A5568; 
    cursor: pointer; 
    border-bottom: 1px solid #F0F4F8; 
}
.menu-item:last-child {
    border-bottom: none; 
}
.menu-item.active { 
    background: #EBF3FB; 
    color: #1A3C6B; 
    font-weight: 700; 
}
.menu-item .m-icon { 
    width: 30px; 
    height: 30px; 
    border-radius: 8px; 
    background: #F4F7FB; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 15px; 
}
.menu-item.active .m-icon { 
    background: #D0E6F8; 
}
.menu-item.danger { 
    color: #A32D2D; 
}
.main-card { 
    background: #fff; 
    border-radius: 14px; 
    border: 1px solid #E0E7EF; 
    overflow: hidden; 
}
.main-header { 
    background: linear-gradient(135deg, #1A3C6B, #2E6DB4); 
    padding: 20px 24px; 
    color: #fff; 
}
.main-header h2 { 
    font-size: 17px; 
    font-weight: 700; 
}
.main-header p { 
    font-size: 12px; 
    opacity: 0.8; 
    margin-top: 3px; 
}
.main-body { 
    padding: 24px; 
}
.section-title { 
    font-size: 12px; 
    font-weight: 700; 
    color: #6B7A8D; 
    text-transform: uppercase; 
    letter-spacing: 0.06em; 
    margin: 20px 0 12px; 
    padding-bottom: 8px; 
    border-bottom: 1px solid #E0E7EF; 
}
.section-title:first-child { 
    margin-top: 0; 
}
.grid-2 { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 14px; 
}
.form-row { 
    margin-bottom: 14px; 
}
label { 
    display: block; 
    font-size: 11px; 
    font-weight: 700; 
    color: #6B7A8D; 
    margin-bottom: 5px; 
    text-transform: uppercase; 
    letter-spacing: 0.05em; 
}
input, select { 
    width: 100%; 
    border: 1px solid #D0DAE8; 
    border-radius: 8px; 
    padding: 10px 12px; 
    font-size: 13px; 
    color: #1A1A2E; 
    background: #F8FAFD; 
}
input[readonly] { 
    background: #EFF2F6; 
    color: #6B7A8D; 
}
.btn-save { 
    background: #1A3C6B; 
    color: #fff; 
    border: none; 
    border-radius: 8px; 
    padding: 11px 28px; 
    font-size: 13px; 
    font-weight: 700; 
    cursor: pointer; 
}
.btn-save:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}
.btn-cancel { 
    background: transparent; 
    color: #6B7A8D; 
    border: 1px solid #D0DAE8; 
    border-radius: 8px; 
    padding: 11px 20px; 
    font-size: 13px; 
    font-weight: 600; 
    cursor: pointer; 
    margin-right: 10px; 
}
.info-banner { 
    background: #EBF3FB; 
    border-left: 4px solid #2E6DB4; 
    border-radius: 0 8px 8px 0; 
    padding: 12px 16px; 
    margin-bottom: 20px; 
    font-size: 13px; 
    color: #1A3C6B; 
}
.toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #1A3C6B;
    color: #fff;
    padding: 14px 22px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    opacity: 0;
    transform: translateY(-12px);
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 999;
}
.toast.show {
    opacity: 1;
    transform: translateY(0);
}
.toast.error {
    background: #991B1B;
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="nav">
  <div class="nav-brand">🏠 Pata Place</div>
  <div class="nav-links" id="navLinks">
    <!-- populated dynamically based on role -->
  </div>
</div>
<div class="content">
  <div class="sidebar">
    <div class="profile-card">
      <div class="avatar" id="avatarInitials">--</div>
      <div class="profile-name" id="sidebarName">Loading...</div>
      <div class="profile-role" id="sidebarEmail">–</div>
      <div class="profile-badge" id="statusBadge">✓ Active</div>
      <div class="stats-mini">
        <div class="stat-mini"><div class="stat-mini-val" id="statRequests">–</div><div class="stat-mini-label" id="statRequestsLabel">Requests</div></div>
        <div class="stat-mini"><div class="stat-mini-val" id="statSecondary">–</div><div class="stat-mini-label" id="statSecondaryLabel">Saved</div></div>
      </div>
    </div>
    <div class="menu-card">
      <div class="menu-item active"><div class="m-icon">👤</div>Edit Profile</div>
      <div class="menu-item danger" onclick="logout()"><div class="m-icon">🚪</div>Logout</div>
    </div>
  </div>
  <div class="main-card">
    <div class="main-header">
      <h2>Edit Profile</h2>
      <p>Update your personal information and account settings</p>
    </div>
    <div class="main-body">
      <div class="info-banner">ℹ️ Your email address is linked to your Pata Place account and cannot be changed here.</div>
      <div class="section-title">Personal Information</div>
      <div class="grid-2">
        <div class="form-row"><label>Full Name</label><input type="text" id="inputName" /></div>
        <div class="form-row"><label>Email Address</label><input type="email" id="inputEmail" readonly /></div>
        <div class="form-row"><label>Phone Number</label><input type="tel" id="inputPhone" placeholder="+254 7XX XXX XXX" /></div>
        <div class="form-row"><label>Role</label><input type="text" id="inputRole" readonly /></div>
      </div>

      <div style="margin-top:24px;">
        <button class="btn-cancel" onclick="loadProfile()">Discard Changes</button>
        <button class="btn-save" id="saveBtn" onclick="saveProfile()">💾 Save Changes</button>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL = 'http://localhost:5000/api';
const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('user') || '{}');

if (!token) {
  window.location.href = '../authentication/login.html';
}

function navigateTo(url) {
  document.body.style.transition = 'opacity 0.3s ease';
  document.body.style.opacity = '0';
  setTimeout(() => { window.location.href = url; }, 300);
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  navigateTo('../authentication/login.html');
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

function getInitials(name) {
  if (!name) return '--';
  const parts = name.trim().split(' ');
  return (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase();
}

// Build navbar links based on role
function buildNav() {
  const navLinks = document.getElementById('navLinks');
  let links = '';

  if (user.role === 'student') {
    links = `
      <a href="student_dashboard.html">Browse</a>
      <a href="requests.html">My Requests</a>
      <a href="notifications.html">Notifications</a>
      <a href="userprofile.html" class="active">Profile</a>
    `;
    document.getElementById('statRequestsLabel').textContent = 'Requests';
    document.getElementById('statSecondaryLabel').textContent = 'Saved';
  } else if (user.role === 'landlord') {
    links = `
      <a href="landlord_dashboard.html">My Properties</a>
      <a href="requests.html">Requests</a>
      <a href="notifications.html">Notifications</a>
      <a href="userprofile.html" class="active">Profile</a>
    `;
    document.getElementById('statRequestsLabel').textContent = 'Properties';
    document.getElementById('statSecondaryLabel').textContent = 'Pending';
  }

  navLinks.innerHTML = links + `<button class="nav-btn" onclick="logout()">Logout</button>`;
}

async function loadProfile() {
  try {
    const res = await fetch(`${API_URL}/users/me`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await res.json();

    if (!res.ok) {
      showToast('Could not load profile', true);
      return;
    }

    document.getElementById('sidebarName').textContent = data.name;
    document.getElementById('sidebarEmail').textContent = data.email;
    document.getElementById('avatarInitials').textContent = getInitials(data.name);

    const badge = document.getElementById('statusBadge');
    if (data.status === 'active') {
      badge.textContent = '✓ Active ' + (data.role.charAt(0).toUpperCase() + data.role.slice(1));
      badge.className = 'profile-badge';
    } else {
      badge.textContent = '⚠ Suspended';
      badge.className = 'profile-badge suspended';
    }

    document.getElementById('inputName').value = data.name;
    document.getElementById('inputEmail').value = data.email;
    document.getElementById('inputPhone').value = data.phone_number;
    document.getElementById('inputRole').value = data.role.charAt(0).toUpperCase() + data.role.slice(1);

    loadStats();

  } catch (error) {
    showToast('Could not reach server. Is the backend running?', true);
  }
}

async function loadStats() {
  if (user.role === 'student') {
    try {
      const res = await fetch(`${API_URL}/requests/my-requests`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const requests = await res.json();
      if (res.ok) {
        document.getElementById('statRequests').textContent = requests.length;
        document.getElementById('statSecondary').textContent =
          requests.filter(r => r.status === 'approved').length;
        document.getElementById('statSecondaryLabel').textContent = 'Approved';
      }
    } catch (error) { /* silent */ }

  } else if (user.role === 'landlord') {
    try {
      const res = await fetch(`${API_URL}/properties/my-properties`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const properties = await res.json();
      if (res.ok) {
        document.getElementById('statRequests').textContent = properties.length;
        document.getElementById('statSecondary').textContent =
          properties.filter(p => p.approval_status === 'pending').length;
      }
    } catch (error) { /* silent */ }
  }
}

async function saveProfile() {
  const name = document.getElementById('inputName').value.trim();
  const phone = document.getElementById('inputPhone').value.trim();

  if (!name || !phone) {
    showToast('Name and phone number are required', true);
    return;
  }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const res = await fetch(`${API_URL}/users/me`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ name, phone_number: phone })
    });

    const data = await res.json();

    if (res.ok) {
      // update localStorage user too so other pages reflect new name
      const updatedUser = { ...user, name: data.user.name };
      localStorage.setItem('user', JSON.stringify(updatedUser));
      showToast('✓ Profile updated successfully');
      loadProfile();
    } else {
      showToast(data.message || 'Could not update profile', true);
    }

  } catch (error) {
    showToast('Could not reach server', true);
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Save Changes';
  }
}

buildNav();
loadProfile();
</script>

</body>
</html>
