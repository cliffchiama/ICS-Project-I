<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pata Place – Add Property</title>
<link rel="icon" type="image/png" href="../assets/headicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: 'Segoe UI', Arial, sans-serif; }
body { 
    background: #F4F7FB; 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; }

/* ── Navbar ── */
.nav { 
    background: #1A3C6B; 
    padding: 0 32px; 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    height: 52px; }
.nav-brand { 
    color: #fff; 
    font-weight: 600; 
    font-size: 16px; 
    display: flex; 
    align-items: center; 
    gap: 8px; }
.nav-brand svg { 
    width: 20px; 
    height: 20px; 
    fill: none; 
    stroke: #fff; 
    stroke-width: 2; 
    stroke-linecap: round; 
    stroke-linejoin: round; }
.nav-right { 
    display: flex; 
    align-items: center; 
    gap: 10px; }
.back-btn { 
    color: #B8CCE4; 
    font-size: 13px; 
    text-decoration: none; 
    padding: 6px 10px; 
    border-radius: 6px; 
    transition: background 0.2s; }
.back-btn:hover { 
    background: rgba(255,255,255,0.12); 
    color: #fff; }
.logout { 
    color: #fff; 
    background: rgba(255,255,255,0.15); 
    border: none; 
    padding: 6px 14px; 
    border-radius: 6px; 
    font-size: 13px; 
    cursor: pointer; }
.logout:hover { 
    background: rgba(255,255,255,0.25); }

/* ── Hero ── */
.hero { 
    background: linear-gradient(135deg, #1A3C6B 0%, #2E6DB4 100%); 
    padding: 28px 32px 36px; }
.hero h1 { 
    color: #fff; 
    font-size: 22px; 
    font-weight: 700; 
    margin-bottom: 4px; }
.hero p { 
    color: #B8CCE4; 
    font-size: 13px; }

/* ── Form Container ── */
.form-container { 
    padding: 0 32px 40px; 
    margin-top: -20px; }
.form-card { 
    background: #fff; 
    border-radius: 12px; 
    border: 1px solid #E0E7EF; 
    padding: 28px 32px; 
    box-shadow: 0 2px 8px rgba(26,60,107,0.07); }

/* ── Section Titles ── */
.form-section { 
    margin-bottom: 28px; }
.form-section-title { 
    font-size: 13px; 
    font-weight: 700; 
    color: #1A3C6B; 
    text-transform: uppercase; 
    letter-spacing: 0.06em; 
    margin-bottom: 16px; 
    padding-bottom: 8px; 
    border-bottom: 1px solid #E0E7EF; }

/* ── Grid Layouts ── */
.grid-2 { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 16px; }
.grid-3 { 
    display: grid; 
    grid-template-columns: 1fr 1fr 1fr; 
    gap: 16px; }

/* ── Form Fields ── */
.form-row { 
    display: flex; 
    flex-direction: column; }
label { 
    font-size: 11px; 
    font-weight: 700; 
    color: #6B7A8D; 
    margin-bottom: 5px; 
    text-transform: uppercase; 
    letter-spacing: 0.05em; }
input, select, textarea { 
    width: 100%; 
    border: 1px solid #D0DAE8; 
    border-radius: 8px; 
    padding: 10px 12px; 
    font-size: 13px; 
    color: #1A1A2E; 
    background: #F8FAFD; 
    outline: none; 
    font-family: inherit; }
input:focus, select:focus, textarea:focus { 
    border-color: #2E6DB4; 
    background: #fff; }
textarea { 
    resize: vertical; 
    min-height: 90px; }

/* ── Amenities ── */
.amenities-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
    gap: 10px; }
.amenity-item { 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    background: #F4F7FB; 
    border: 1px solid #D0DAE8; 
    border-radius: 8px; 
    padding: 10px 12px; 
    cursor: pointer; 
    transition: all 0.2s; }
.amenity-item input[type="checkbox"] { 
    width: 16px; 
    height: 16px; 
    accent-color: #1A3C6B; 
    cursor: pointer; }
.amenity-item span { 
    font-size: 13px; 
    color: #1A1A2E; }
.amenity-item:has(input:checked) { 
    border-color: #2E6DB4; 
    background: #EBF3FB; }

/* ── Photo Upload ── */
.upload-area { 
    border: 2px dashed #D0DAE8; 
    border-radius: 10px; 
    padding: 32px; 
    text-align: center; 
    background: #F8FAFD; 
    cursor: pointer; 
    transition: border-color 0.2s; }
.upload-area:hover { 
    border-color: #2E6DB4; }
.upload-icon { 
    font-size: 32px; 
    margin-bottom: 8px; }
.upload-area p { 
    font-size: 13px; 
    color: #6B7A8D; }
.upload-area span { 
    font-size: 11px; 
    color: #9AAAB8; 
    display: block; 
    margin-top: 4px; }

/* ── Form Actions ── */
.form-actions { 
    display: flex; 
    gap: 12px; 
    justify-content: flex-end; 
    margin-top: 8px; }
.btn-cancel { 
    background: #F4F7FB; 
    border: 1px solid #D0DAE8; 
    border-radius: 8px; 
    padding: 11px 24px; 
    font-size: 14px; 
    font-weight: 600; 
    color: #6B7A8D; 
    cursor: pointer; 
    transition: background 0.2s; }
.btn-cancel:hover { 
    background: #E0E7EF; }
.btn-save { 
    background: #1A3C6B; 
    border: none; 
    border-radius: 8px; 
    padding: 11px 28px; 
    font-size: 14px; 
    font-weight: 600; 
    color: #fff; 
    cursor: pointer; 
    transition: background 0.2s; }
.btn-save:hover { 
    background: #2E6DB4; }
.btn-save:disabled {
    opacity: 0.6;
    cursor: not-allowed; }

/* ── Toast ── */
.toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #1A3C6B;
    color: #fff;
    padding: 14px 22px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    opacity: 0;
    transform: translateY(-12px);
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 999; }
.toast.show {
    opacity: 1;
    transform: translateY(0); }
.toast.error {
    background: #991B1B; }
</style>
</head>
<body>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Navbar -->
<nav class="nav">
  <div class="nav-brand">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Pata Place
  </div>
  <div class="nav-right">
    <a href="landlord_dashboard.html" class="back-btn">← Back to Dashboard</a>
    <button class="logout" onclick="logout()">Log out</button>
  </div>
</nav>

<!-- Hero -->
<div class="hero">
  <h1>Add New Property</h1>
  <p>Fill in the details below to list your property for Strathmore students</p>
</div>

<!-- Form -->
<div class="form-container">
  <div class="form-card">

    <!-- Basic Info -->
    <div class="form-section">
      <div class="form-section-title">Basic Information</div>
      <div class="grid-2" style="margin-bottom: 16px;">
        <div class="form-row">
          <label>Property Name</label>
          <input type="text" id="propertyName" placeholder="e.g. Kilimani Studio Apartment" />
        </div>
        <div class="form-row">
          <label>Property Type</label>
          <select id="propertyType">
            <option value="">Select type...</option>
            <option>Bedsitter</option>
            <option>Single Room</option>
            <option>1 Bedroom</option>
            <option>2 Bedroom</option>
            <option>3 Bedroom</option>
            <option>Shared Room</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>Description</label>
        <textarea id="description" placeholder="Describe the property, nearby amenities, distance from Strathmore..."></textarea>
      </div>
    </div>

    <!-- Location & Pricing -->
    <div class="form-section">
      <div class="form-section-title">Location & Pricing</div>
      <div class="grid-3" style="margin-bottom: 16px;">
        <div class="form-row">
          <label>Location / Estate</label>
          <input type="text" id="location" placeholder="e.g. Kilimani, Nairobi" />
        </div>
        <div class="form-row">
          <label>Distance from Campus</label>
          <input type="text" id="distance" placeholder="e.g. 1.2 km" />
        </div>
        <div class="form-row">
          <label>Price per Month (KES)</label>
          <input type="number" id="price" placeholder="e.g. 12000" />
        </div>
      </div>
      <div class="grid-2">
        <div class="form-row">
          <label>Deposit (KES)</label>
          <input type="number" id="deposit" placeholder="e.g. 24000" />
        </div>
        <div class="form-row">
          <label>Bills</label>
          <select id="bills">
            <option value="">Select...</option>
            <option value="true">Included in rent</option>
            <option value="false">Excluded from rent</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Availability -->
    <div class="form-section">
      <div class="form-section-title">Availability</div>
      <div class="grid-2">
        <div class="form-row">
          <label>Availability Status</label>
          <select id="availStatus">
            <option value="available">Available</option>
            <option value="unavailable">Unavailable</option>
          </select>
        </div>
        <div class="form-row">
          <label>Date Available From</label>
          <input type="date" id="dateAvailable" />
        </div>
      </div>
    </div>

    <!-- Amenities -->
    <div class="form-section">
      <div class="form-section-title">Amenities</div>
      <div class="amenities-grid">
        <label class="amenity-item"><input type="checkbox" id="am_wifi" /><span><i class="fas fa-wifi"></i> Wi-Fi</span></label>
        <label class="amenity-item"><input type="checkbox" id="am_water" /><span><i class="fas fa-tint"></i> Water</span></label>
        <label class="amenity-item"><input type="checkbox" id="am_security" /><span><i class="fas fa-lock"></i> Security</span></label>
        <label class="amenity-item"><input type="checkbox" id="am_power" /><span><i class="fas fa-battery-full"></i> Power Backup</span></label>
        <label class="amenity-item"><input type="checkbox" id="am_furnished" /><span><i class="fas fa-couch"></i> Furnished</span></label>
        <label class="amenity-item"><input type="checkbox" id="am_parking" /><span><i class="fas fa-parking"></i> Parking</span></label>
        <label class="amenity-item"><input type="checkbox" id="am_gym" /><span><i class="fas fa-dumbbell"></i> Gym</span></label>
        <label class="amenity-item"><input type="checkbox" id="am_kitchen" /><span><i class="fas fa-utensils"></i> Kitchen</span></label>
      </div>
    </div>

    <!-- Photos -->
    <div class="form-section">
      <div class="form-section-title">Property Photos</div>
      <div class="upload-area" onclick="document.getElementById('photoInput').click()">
        <div class="upload-icon">📷</div>
        <p>Click to upload or drag and drop photos</p>
        <span>PNG, JPG up to 5MB each</span>
        <input type="file" id="photoInput" multiple accept="image/*" style="display:none" />
      </div>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button class="btn-cancel" onclick="navigateTo('landlord_dashboard.html')">Cancel</button>
      <button class="btn-save" id="saveBtn" onclick="submitProperty()">✓ Save Property Listing</button>
    </div>

  </div>
</div>

<script>
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => { t.className = 'toast'; }, 3500);
  }

  function navigateTo(url) {
    document.body.style.transition = 'opacity 0.3s ease';
    document.body.style.opacity = '0';
    setTimeout(() => { window.location.href = url; }, 300);
  }

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    navigateTo('../authentication/login.html');
  }

  async function submitProperty() {
    // Basic validation
    const name      = document.getElementById('propertyName').value.trim();
    const type      = document.getElementById('propertyType').value;
    const desc      = document.getElementById('description').value.trim();
    const location  = document.getElementById('location').value.trim();
    const distance  = document.getElementById('distance').value.trim();
    const price     = document.getElementById('price').value;
    const deposit   = document.getElementById('deposit').value;
    const bills     = document.getElementById('bills').value;
    const status    = document.getElementById('availStatus').value;
    const dateAvail = document.getElementById('dateAvailable').value;

    if (!name || !type || !desc || !location || !distance || !price || !deposit || !bills) {
      showToast('Please fill in all required fields.', true);
      return;
    }

    const amenities = {
      wifi:         document.getElementById('am_wifi').checked,
      water:        document.getElementById('am_water').checked,
      security:     document.getElementById('am_security').checked,
      power_backup: document.getElementById('am_power').checked,
      furnished:    document.getElementById('am_furnished').checked,
      parking:      document.getElementById('am_parking').checked,
      gym:          document.getElementById('am_gym').checked,
      kitchen:      document.getElementById('am_kitchen').checked
    };

    const token = localStorage.getItem('token');
    if (!token) {
      showToast('You are not logged in.', true);
      return;
    }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      const response = await fetch('http://localhost:5000/api/properties', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({
          property_name:        name,
          property_type:        type,
          description:          desc,
          location,
          distance_from_campus: distance,
          price:                Number(price),
          deposit:              Number(deposit),
          bills_included:       bills === 'true',
          availability_status:  status,
          date_available:       dateAvail || null,
          amenities
        })
      });

      const data = await response.json();

      if (response.ok) {
        showToast('✓ Property submitted! Awaiting admin approval.');
        setTimeout(() => navigateTo('landlord_dashboard.html'), 2000);
      } else {
        showToast(data.message || 'Something went wrong.', true);
        btn.disabled = false;
        btn.textContent = '✓ Save Property Listing';
      }

    } catch (err) {
      showToast('Could not reach server. Is the backend running?', true);
      btn.disabled = false;
      btn.textContent = '✓ Save Property Listing';
    }
  }
</script>
</body>
</html>
