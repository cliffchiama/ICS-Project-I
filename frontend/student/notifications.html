<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pata Place – Notifications</title>
<link rel="icon" type="image/png" href="../assets/headicon.png">
<style>
* { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: 'Segoe UI', Arial, sans-serif; }
body { 
    background: #F4F7FB; 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; }

/* ── Navbar ── */
.nav { 
    background: #1A3C6B; 
    padding: 0 32px; 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    height: 52px; }
.nav-brand { 
    color: #fff; 
    font-weight: 600; 
    font-size: 16px; 
    display: flex; 
    align-items: center; 
    gap: 8px; }
.nav-brand svg { 
    width: 20px; 
    height: 20px; 
    fill: none; 
    stroke: #fff; 
    stroke-width: 2; 
    stroke-linecap: round; 
    stroke-linejoin: round; }
.nav-links { 
    display: flex; 
    align-items: center; 
    gap: 6px; }
.nav-links a { 
    color: #B8CCE4; 
    font-size: 13px; 
    text-decoration: none; 
    padding: 6px 10px; 
    border-radius: 6px; 
    transition: background 0.2s; }
.nav-links a:hover, .nav-links a.active { 
    background: rgba(255,255,255,0.12); 
    color: #fff; }
.nav-links .logout { 
    color: #fff; 
    background: rgba(255,255,255,0.15); 
    border: none; 
    padding: 6px 14px; 
    border-radius: 6px; 
    font-size: 13px; 
    cursor: pointer; }
.nav-links .logout:hover { 
    background: rgba(255,255,255,0.25); }

/* ── Hero ── */
.hero { 
    background: linear-gradient(135deg, #1A3C6B 0%, #2E6DB4 100%); 
    padding: 28px 32px 36px; 
    display: flex;
    align-items: center;
    justify-content: space-between; }
.hero h1 { 
    color: #fff; 
    font-size: 22px; 
    font-weight: 700; 
    margin-bottom: 4px; }
.hero p { 
    color: #B8CCE4; 
    font-size: 13px; }
.mark-all-btn {
    background: #fff;
    color: #1A3C6B;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s; }
.mark-all-btn:hover {
    background: #EBF3FB; }

/* ── Content ── */
.content { 
    padding: 24px 32px 32px; 
    max-width: 760px; }

/* ── Notification Cards ── */
.notif-list {
    display: flex;
    flex-direction: column;
    gap: 10px; }
.notif-card {
    background: #fff;
    border-radius: 10px;
    border: 1px solid #E0E7EF;
    padding: 16px 18px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    box-shadow: 0 2px 8px rgba(26,60,107,0.05);
    cursor: pointer;
    transition: background 0.2s; }
.notif-card:hover {
    background: #FAFBFD; }
.notif-card.unread {
    border-left: 3px solid #2E6DB4;
    background: #F7FAFE; }
.notif-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #EBF3FB;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0; }
.notif-body {
    flex: 1; }
.notif-message {
    font-size: 13px;
    color: #1A1A2E;
    line-height: 1.4; }
.notif-card.unread .notif-message {
    font-weight: 600; }
.notif-time {
    font-size: 11px;
    color: #9AAAB8;
    margin-top: 4px; }
.unread-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2E6DB4;
    flex-shrink: 0;
    margin-top: 6px; }

/* ── Empty State ── */
.empty-state {
    background: #fff;
    border-radius: 10px;
    border: 1px solid #E0E7EF;
    padding: 48px 24px;
    text-align: center; }
.empty-icon {
    font-size: 36px;
    margin-bottom: 10px; }
.empty-state p {
    font-size: 13px;
    color: #9AAAB8; }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="nav">
  <div class="nav-brand">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Pata Place
  </div>
  <div class="nav-links" id="navLinks">
    <!-- populated dynamically based on role -->
  </div>
</nav>

<!-- Hero -->
<div class="hero">
  <div>
    <h1>Notifications</h1>
    <p id="heroSub">Stay updated on your activity</p>
  </div>
  <button class="mark-all-btn" onclick="markAllRead()">Mark all as read</button>
</div>

<!-- Content -->
<div class="content">
  <div class="notif-list" id="notifList">
    <div class="empty-state"><div class="empty-icon">⏳</div><p>Loading...</p></div>
  </div>
</div>

<script>
const API_URL = 'http://localhost:5000/api';
const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('user') || '{}');

if (!token) {
  window.location.href = '../authentication/login.html';
}

function navigateTo(url) {
  document.body.style.transition = 'opacity 0.3s ease';
  document.body.style.opacity = '0';
  setTimeout(() => { window.location.href = url; }, 300);
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  navigateTo('../authentication/login.html');
}

// Build navbar links based on role
function buildNav() {
  const navLinks = document.getElementById('navLinks');
  let links = '';

  if (user.role === 'student') {
    links = `
      <a href="student_dashboard.html">Browse</a>
      <a href="requests.html">My Requests</a>
      <a href="#" class="active">Notifications</a>
      <a href="userprofile.html">Profile</a>
    `;
  } else if (user.role === 'landlord') {
    links = `
      <a href="dashboard.html">My Properties</a>
      <a href="requests.html">Requests</a>
      <a href="#" class="active">Notifications</a>
      <a href="userprofile.html">Profile</a>
    `;
  } else if (user.role === 'admin') {
    links = `
      <a href="admin_dashboard.html">Dashboard</a>
      <a href="#" class="active">Notifications</a>
    `;
  }

  navLinks.innerHTML = links + `<button class="logout" onclick="logout()">Log out</button>`;
}

function timeAgo(dateStr) {
  const seconds = Math.floor((new Date() - new Date(dateStr)) / 1000);
  if (seconds < 60) return 'Just now';
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes}m ago`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.floor(hours / 24);
  if (days < 7) return `${days}d ago`;
  return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function getIcon(message) {
  if (message.includes('approved')) return '✅';
  if (message.includes('declined') || message.includes('rejected')) return '❌';
  if (message.includes('cancelled')) return '⚠️';
  if (message.includes('New viewing request')) return '📩';
  return '🔔';
}

async function loadNotifications() {
  try {
    const res = await fetch(`${API_URL}/notifications`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const notifications = await res.json();
    const list = document.getElementById('notifList');

    if (!res.ok) {
      list.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p>Could not load notifications. Is the backend running?</p></div>`;
      return;
    }

    if (notifications.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="empty-icon">🔔</div><p>No notifications yet</p></div>`;
      return;
    }

    const unreadCount = notifications.filter(n => !n.read).length;
    document.getElementById('heroSub').textContent =
      unreadCount > 0 ? `You have ${unreadCount} unread notification${unreadCount > 1 ? 's' : ''}` : 'You\'re all caught up';

    list.innerHTML = notifications.map(n => `
      <div class="notif-card ${n.read ? '' : 'unread'}" id="notif-${n._id}" onclick="markRead('${n._id}')">
        <div class="notif-icon">${getIcon(n.message)}</div>
        <div class="notif-body">
          <div class="notif-message">${n.message}</div>
          <div class="notif-time">${timeAgo(n.createdAt)}</div>
        </div>
        ${n.read ? '' : '<div class="unread-dot"></div>'}
      </div>
    `).join('');

  } catch (error) {
    document.getElementById('notifList').innerHTML =
      `<div class="empty-state"><div class="empty-icon">⚠️</div><p>Could not reach server. Is the backend running?</p></div>`;
  }
}

async function markRead(id) {
  const card = document.getElementById(`notif-${id}`);
  if (card && !card.classList.contains('unread')) return; // already read

  try {
    await fetch(`${API_URL}/notifications/${id}/read`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    loadNotifications();
  } catch (error) {
    // silent fail
  }
}

async function markAllRead() {
  try {
    await fetch(`${API_URL}/notifications/read-all`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    loadNotifications();
  } catch (error) {
    alert('Could not reach server');
  }
}

buildNav();
loadNotifications();
</script>

</body>
</html>
