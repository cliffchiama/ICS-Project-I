<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" href="../assets/headicon.png">
<meta charset="UTF-8">
<title>Pata Place – My Requests</title>
<style>
* { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: 'Segoe UI', Arial, sans-serif;
}
body { 
    background: #F4F7FB; 
}
.nav { 
    background: #1A3C6B; 
    padding: 0 28px; 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    height: 52px; 
}
.nav-brand { 
    color: #fff; 
    font-weight: 600; 
    font-size: 15px; 
}
.nav-links { 
    display: flex; 
    gap: 24px; 
    align-items: center; 
}
.nav-links a {
    color: rgba(255,255,255,0.75); 
    font-size: 13px; 
    text-decoration: none;
} 
.nav-links a.active { 
    color: #fff; 
    font-weight: 600; 
}
.nav-btn { 
    background: #fff; 
    color: #1A3C6B; 
    border: none; 
    border-radius: 20px; 
    padding: 5px 16px; 
    font-size: 12px; 
    font-weight: 600; 
    cursor: pointer;
}
.content { 
    padding: 28px; 
}
.page-header { 
    margin-bottom: 24px; 
}
.page-header h2 { 
    font-size: 20px; 
    font-weight: 700; 
    color: #1A1A2E; 
    margin-bottom: 4px; }
.page-header p { 
    font-size: 13px; 
    color: #6B7A8D; 
}
.summary-cards { 
    display: grid; 
    grid-template-columns: repeat(4, 1fr); 
    gap: 14px; 
    margin-bottom: 24px; 
}
.s-card { 
    background: #fff; 
    border-radius: 10px; 
    border: 1px solid #E0E7EF; 
    padding: 16px; 
}
.s-label { 
    font-size: 11px; 
    font-weight: 600; 
    color: #6B7A8D; 
    text-transform: uppercase; 
    letter-spacing: 0.05em; 
    margin-bottom: 6px; 
}
.s-val { 
    font-size: 24px; 
    font-weight: 700; 
    color: #1A1A2E; 
}
.s-sub { 
    font-size: 11px; 
    color: #639922; 
    margin-top: 2px; 
}
.table-card { 
    background: #fff; 
    border-radius: 14px; 
    border: 1px solid #E0E7EF; 
    overflow: hidden; 
}
.table-header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    padding: 16px 20px; 
    border-bottom: 1px solid #E0E7EF; 
}
.table-header h3 { 
    font-size: 15px; 
    font-weight: 600; 
    color: #1A1A2E; 
}
table { 
    width: 100%; 
    border-collapse: collapse; 
}
th { 
    background: #F4F7FB; 
    padding: 11px 16px; 
    text-align: left; 
    font-size: 11px; 
    font-weight: 700; 
    color: #6B7A8D; 
    text-transform: uppercase; 
    letter-spacing: 0.05em; 
    border-bottom: 1px solid #E0E7EF; 
}
td { 
    padding: 13px 16px; 
    font-size: 13px; 
    color: #1A1A2E; 
    border-bottom: 1px solid #F0F4F8; 
    vertical-align: middle; 
}
tr:last-child td { 
    border-bottom: none; 
}
tr:hover td { 
    background: #FAFCFE; 
}
.pill { 
    border-radius: 20px; 
    padding: 4px 12px; 
    font-size: 11px; 
    font-weight: 700; 
    display: inline-block; 
}
.pill.approved { 
    background: #EAF3DE; 
    color: #3B6D11; 
}
.pill.pending { 
    background: #FAEEDA; 
    color: #854F0B; 
}
.pill.cancelled, .pill.rejected { 
    background: #FCEBEB; 
    color: #A32D2D; 
}
.icon-btn { 
    background: transparent; 
    border: 1px solid #D0DAE8; 
    border-radius: 6px; 
    padding: 5px 10px; 
    font-size: 12px; 
    cursor: pointer; 
    color: #1A1A2E; 
    margin-right: 4px; 
}
.icon-btn.danger { 
    border-color: #F09595; 
    color: #A32D2D; 
}
.icon-btn:disabled { 
    opacity: 0.35; 
    cursor: not-allowed; 
}
.prop-cell { 
    font-weight: 600; 
}
.prop-cell small { 
    display: block; 
    font-size: 11px; 
    font-weight: 400; 
    color: #6B7A8D; 
    margin-top: 2px; 
}
.empty-state, .loading-state {
    padding: 50px 20px;
    text-align: center;
    color: #6B7A8D;
    font-size: 13px;
}
</style>
</head>
<body>
<div class="nav">
  <div class="nav-brand">🏠 Pata Place</div>
  <div class="nav-links">
    <a href="student_dashboard.html">Browse</a>
    <a href="requests.html" class="active">My Requests</a>
    <a href="#">Notifications</a>
    <a href="#">Profile</a>
    <button class="nav-btn" onclick="logout()">Logout</button>
  </div>
</div>
<div class="content">
  <div class="page-header">
    <h2>My Viewing Requests</h2>
    <p>Track the status of all your property viewing applications</p>
  </div>
  <div class="summary-cards">
    <div class="s-card"><div class="s-label">Total Requests</div><div class="s-val" id="totalCount">0</div></div>
    <div class="s-card"><div class="s-label">Approved</div><div class="s-val" id="approvedCount" style="color:#3B6D11;">0</div></div>
    <div class="s-card"><div class="s-label">Pending</div><div class="s-val" id="pendingCount" style="color:#854F0B;">0</div></div>
    <div class="s-card"><div class="s-label">Cancelled</div><div class="s-val" id="cancelledCount" style="color:#A32D2D;">0</div></div>
  </div>
  <div class="table-card">
    <div class="table-header">
      <h3>All Requests</h3>
      <button style="background:#1A3C6B;color:#fff;border:none;border-radius:7px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;" onclick="window.location.href='student_dashboard.html'">+ New Request</button>
    </div>
    <table>
      <thead><tr><th>Property</th><th>Request ID</th><th>Date Requested</th><th>Viewing Date</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="requestsBody">
        <tr><td colspan="6" class="loading-state">Loading your requests…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const API_BASE = 'http://localhost:5000/api';
const token = localStorage.getItem('token');

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = 'login.html';
}

function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function formatDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function pillFor(status) {
  const map = {
    approved: ['approved', '✓ Approved'],
    pending: ['pending', '⏳ Pending'],
    cancelled: ['cancelled', '✕ Cancelled'],
    declined: ['rejected', '✕ Declined']
  };
  const [cls, label] = map[status] || ['pending', status];
  return `<span class="pill ${cls}">${label}</span>`;
}

function shortId(id) {
  return '#REQ-' + id.slice(-6).toUpperCase();
}

function renderSummary(requests) {
  document.getElementById('totalCount').textContent = requests.length;
  document.getElementById('approvedCount').textContent = requests.filter(r => r.status === 'approved').length;
  document.getElementById('pendingCount').textContent = requests.filter(r => r.status === 'pending').length;
  document.getElementById('cancelledCount').textContent = requests.filter(r => r.status === 'cancelled' || r.status === 'declined').length;
}

function renderTable(requests) {
  const body = document.getElementById('requestsBody');

  if (!requests.length) {
    body.innerHTML = '<tr><td colspan="6" class="empty-state">No viewing requests yet. Browse listings and request a viewing to get started.</td></tr>';
    return;
  }

  body.innerHTML = requests.map(r => {
    const property = r.property_id || {};
    const canCancel = r.status === 'pending' || r.status === 'approved';
    return `
      <tr>
        <td><div class="prop-cell">${escapeHtml(property.property_name || 'Property removed')}<small>📍 ${escapeHtml(property.location || '—')} · KES ${property.price ? Number(property.price).toLocaleString() : '—'}/mo</small></div></td>
        <td style="color:#6B7A8D;">${shortId(r._id)}</td>
        <td>${formatDate(r.createdAt)}</td>
        <td>${formatDate(r.viewing_date)}</td>
        <td>${pillFor(r.status)}</td>
        <td>
          <button class="icon-btn" onclick="viewProperty('${property._id || ''}')" ${property._id ? '' : 'disabled'}>👁 View</button>
          <button class="icon-btn danger" onclick="cancelRequest('${r._id}')" ${canCancel ? '' : 'disabled'}>✕ Cancel</button>
        </td>
      </tr>
    `;
  }).join('');
}

function viewProperty(id) {
  if (!id) return;
  window.location.href = `propertyview.html?id=${id}`;
}

async function loadRequests() {
  if (!token) {
    document.getElementById('requestsBody').innerHTML = '<tr><td colspan="6" class="empty-state">Please log in to view your requests.</td></tr>';
    return;
  }
  try {
    const res = await fetch(`${API_BASE}/requests/my-requests`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!res.ok) throw new Error('Could not load requests');
    const requests = await res.json();
    renderSummary(requests);
    renderTable(requests);
  } catch (err) {
    document.getElementById('requestsBody').innerHTML = `<tr><td colspan="6" class="empty-state">Couldn't load your requests. ${escapeHtml(err.message)}</td></tr>`;
  }
}

async function cancelRequest(id) {
  if (!confirm('Cancel this viewing request?')) return;
  try {
    const res = await fetch(`${API_BASE}/requests/${id}/cancel`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await res.json();
    if (!res.ok) {
      alert(data.message || 'Could not cancel request.');
      return;
    }
    loadRequests();
  } catch (err) {
    alert('Network error. Is the server running?');
  }
}

loadRequests();
</script>
</body>
</html>
